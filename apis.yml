name: Aldiusa

description: >-
  Aldi USA operates a network of grocery stores across the United States, offering a limited‑assortment
  model focused on high‑quality private‑label products at everyday low prices. The company emphasizes
  simplicity, efficiency, and value, providing both in‑store shopping and online ordering for pickup
  and delivery through its website. Aldi USA is part of the global Aldi group, known for its cost‑effective
  retail approach and commitment to sustainability.

